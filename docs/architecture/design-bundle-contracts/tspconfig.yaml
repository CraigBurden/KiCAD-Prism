# Mirrors the fork's tspconfig.yaml (kicad_monkey b6316117): one JSON Schema
# (draft 2020-12) file per @jsonSchema root model, every object sealed, and
# every warning an error. Only the output directory differs while the
# contracts are staged here; after WP-F1 this emits into
# native/contracts/generated/schema/ (see README.md).
emit:
  - "@typespec/json-schema"

options:
  "@typespec/json-schema":
    emitter-output-dir: "{project-root}/generated/schema"
    file-type: json
    seal-object-schemas: true

warn-as-error: true
