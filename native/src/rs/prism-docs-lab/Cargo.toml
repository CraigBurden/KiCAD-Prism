[package]
name = "prism-docs-lab"
description = "Documentation prototypes over a design bundle: the net-class atlas (not Release Studio)"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
authors = ["KiCAD Prism contributors"]
repository = "https://github.com/krishna-swaroop/KiCAD-Prism"
publish = false

[lints]
workspace = true

[dependencies]
geometer-client.workspace = true
prism-artwork = { path = "../prism-artwork" }
prism-bundle = { path = "../prism-bundle", default-features = false, features = ["reader"] }
prism-kicad-contracts = { path = "../prism-kicad-contracts" }
prism-kicad-core = { path = "../prism-kicad-core" }
prism-projections = { path = "../prism-projections" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
