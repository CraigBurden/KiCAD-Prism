[package]
name = "prism-bundle"
description = "The board.prism design bundle: manifest a2, build, read and verify (ADR §6, bundle-format.md)"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
authors = ["KiCAD Prism contributors"]
repository = "https://github.com/krishna-swaroop/KiCAD-Prism"
publish = false

[lints]
workspace = true

[features]
default = ["build"]
# Reading and verifying a bundle, with no dependency on the parser
# (prism-sim-studio uses only this).
reader = []
# Building a bundle from KiCad sources.
build = ["reader", "dep:prism-kicad-core", "dep:prism-projections"]

[dependencies]
prism-kicad-core = { path = "../prism-kicad-core", optional = true }
prism-projections = { path = "../prism-projections", optional = true }
