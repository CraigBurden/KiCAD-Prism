name: Analytic materializer

# The materializer, its contract, the pack, and the browser adapter on every
# platform the design lists, plus the wasm32 builds the viewer relies on.

on:
  pull_request:
    paths:
      - "src/rs/prism-kicad-contracts/**"
      - "src/rs/prism-kicad-core/**"
      - "src/rs/prism-kicad-materialization-pack/**"
      - "src/rs/prism-kicad-wasm/**"
      - "src/tsp/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/materializer.yml"
  push:
    branches: [main, feat/rust-analytic-materializer]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  native:
    name: Materializer (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: ubuntu-22.04-arm
            platform: linux-arm64
          - os: macos-15
            platform: macos-arm64
          - os: macos-13
            platform: macos-x64
          - os: windows-latest
            platform: windows-x64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Contract and pack
        run: cargo test --locked -p prism-kicad-contracts -p prism-kicad-materialization-pack
      - name: Producer
        shell: bash
        run: |
          tests=()
          for file in src/rs/prism-kicad-core/tests/board_materialization_*.rs; do
            tests+=(--test "$(basename "${file}" .rs)")
          done
          cargo test --locked -p prism-kicad-core --lib board_materialization
          cargo test --locked -p prism-kicad-core "${tests[@]}"
      - name: Browser adapter (native)
        run: cargo test --locked -p prism-kicad-wasm --lib materialization

  wasm32:
    name: Materializer (wasm32)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Producer, contract, and pack build for wasm32
        run: >-
          cargo build --locked --target wasm32-unknown-unknown
          -p prism-kicad-contracts -p prism-kicad-core -p prism-kicad-materialization-pack
      - name: Viewer adapter (pack reading and lowering only)
        run: >-
          cargo clippy --locked --target wasm32-unknown-unknown -p prism-kicad-wasm
          --no-default-features --features materialization -- -D warnings
      - name: In-browser producer
        run: >-
          cargo check --locked --target wasm32-unknown-unknown -p prism-kicad-wasm
          --no-default-features --features materialize
