name: Quality gate

on:
  pull_request:
    branches:
      - dev
      - main
      - feature/release-studio
      - feature/system-builder
      - feature/native-design-bundle
      # Work packages of the native design bundle stack on each other (ADR §9.1).
      - wp/**
      - fix/architecture-consolidation
  push:
    branches:
      - dev
      - main
      - feature/release-studio
      - feature/native-design-bundle
      - fix/architecture-consolidation
  schedule:
    # Live KiCad is not on every feature commit; keep a daily executor check.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed areas
    # Pull requests skip the jobs their files cannot affect (scripts/ci_changes.py). Pushes, the
    # nightly run and manual runs run everything, so a rule that is too narrow fails late, never silently.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.areas.outputs.backend }}
      frontend: ${{ steps.areas.outputs.frontend }}
      viewer: ${{ steps.areas.outputs.viewer }}
      design_compare: ${{ steps.areas.outputs.design_compare }}
      agent: ${{ steps.areas.outputs.agent }}
      native: ${{ steps.areas.outputs.native }}
      deploy: ${{ steps.areas.outputs.deploy }}
      deps: ${{ steps.areas.outputs.deps }}
      image: ${{ steps.areas.outputs.image }}
      image_live: ${{ steps.areas.outputs.image_live }}

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Test the path rules
        run: python3 -m unittest scripts.test_ci_changes

      - name: Decide which jobs this change needs
        id: areas
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python3 scripts/ci_changes.py --base "$BASE_SHA" --head HEAD >> "$GITHUB_OUTPUT"
          else
            python3 scripts/ci_changes.py --all >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  catalog-architecture:
    name: Catalog architecture and agent guidance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Resolve catalog architecture base ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ZERO_SHA="0000000000000000000000000000000000000000"

          is_usable_prior() {
            local ref="${1:-}"
            if [ -z "$ref" ] || [ "$ref" = "$ZERO_SHA" ]; then
              return 1
            fi
            if ! git rev-parse --verify "${ref}^{commit}" >/dev/null 2>&1; then
              return 1
            fi
            local resolved head
            resolved="$(git rev-parse --verify "${ref}^{commit}")"
            head="$(git rev-parse --verify HEAD)"
            if [ "$resolved" = "$head" ] || [ "$resolved" = "$HEAD_SHA" ]; then
              return 1
            fi
            return 0
          }

          export_base_ref() {
            local resolved
            resolved="$(git rev-parse --verify "${1}^{commit}")"
            echo "CATALOG_BASE_REF=${resolved}" >> "$GITHUB_ENV"
          }

          try_head_parent() {
            if ! git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              return 1
            fi
            if is_usable_prior HEAD^; then
              export_base_ref HEAD^
              return 0
            fi
            return 1
          }

          bootstrap() {
            echo "Catalog architecture baseline bootstrap: no genuine prior commit; source-vs-baseline only"
            echo "CATALOG_BASELINE_BOOTSTRAP=1" >> "$GITHUB_ENV"
          }

          case "$EVENT_NAME" in
            pull_request)
              if is_usable_prior "$PR_BASE_SHA"; then
                export_base_ref "$PR_BASE_SHA"
              elif try_head_parent; then
                :
              else
                bootstrap
              fi
              ;;
            push)
              if is_usable_prior "$PUSH_BEFORE"; then
                export_base_ref "$PUSH_BEFORE"
              elif try_head_parent; then
                :
              else
                bootstrap
              fi
              ;;
            *)
              if try_head_parent; then
                :
              else
                bootstrap
              fi
              ;;
          esac

      - name: Check catalog architecture ratchets
        run: |
          set -euo pipefail
          if [ "${CATALOG_BASELINE_BOOTSTRAP:-}" = "1" ]; then
            echo "Catalog architecture baseline bootstrap: no prior commit; source-vs-baseline only"
            python3 scripts/check_catalog_architecture.py
          else
            python3 scripts/check_catalog_architecture.py --base-ref "$CATALOG_BASE_REF"
          fi

      - name: Check module sizes
        # 1,200 lines per production module (500 for catalog facades); oversized modules that
        # predate the rule may shrink, never grow. Same baseline file and base ref as above.
        run: |
          set -euo pipefail
          if [ "${CATALOG_BASELINE_BOOTSTRAP:-}" = "1" ]; then
            python3 scripts/check_module_size.py
          else
            python3 scripts/check_module_size.py --base-ref "$CATALOG_BASE_REF"
          fi

      - name: Check agent guidance
        run: python3 scripts/check_agent_docs.py

      - name: Test architecture and module size checkers
        run: python3 -m unittest backend.tests.test_catalog_architecture backend.tests.test_module_size_gate -v

      - name: Compile Python sources
        run: python3 -m compileall -q backend/app scripts/check_catalog_architecture.py scripts/check_module_size.py scripts/architecture_baseline.py

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Hold the react-doctor backlog
        # react-doctor exits 0 whatever it finds, so the gate compares the
        # count against react-doctor-baseline.json. Errors always fail; the
        # warning backlog may shrink but never grow.
        run: npm run scan:gate

      - name: Build application
        run: npm run build

      - name: Build Remote Symbol Provider panel
        run: npm run build:panel

  frontend-tests:
    name: Frontend tests (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --shard=${{ matrix.shard }}/2

  backend:
    name: Backend (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Whole test modules, balanced by backend/tests/.test_durations.json (backend/tests/conftest.py).
        # Refresh that file with scripts/update_backend_test_durations.py when the shards drift apart.
        shard: [1, 2, 3]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kicad_prism_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kicad_prism_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    env:
      AUTH_ENABLED: "false"
      DEV_GUEST_ROLE: admin
      KICAD_PROJECTS_ROOT: ${{ github.workspace }}/.ci-data/projects
      PRISM_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/kicad_prism_test
      # The catalog integration suite refuses to run against the application
      # database, because it drops and rebuilds schema objects. Pointing both
      # names at one database silently skipped the entire suite.
      TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/kicad_prism_catalog_test
      LEGACY_SURVIVOR_TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/kicad_prism_survivor_test

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version

      - name: Cache uv downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('.python-version', 'requirements/runtime.lock', 'requirements/test.txt') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install dependencies
        # The runner is throwaway, so the test tools (requirements/test.txt) go
        # beside the runtime here; locally they stay out of the venv. uv is the image's own pin.
        run: |
          version="$(sed -n 's/^ARG UV_VERSION=//p' Dockerfile | head -n 1)"
          test -n "$version"
          python -m pip install --disable-pip-version-check "uv==${version}"
          uv pip install --system -r requirements.txt -r ../requirements/test.txt

      - name: Create the isolated catalog test database
        run: |
          psql "$PRISM_DATABASE_URL" -c 'CREATE DATABASE kicad_prism_catalog_test'
          psql "$PRISM_DATABASE_URL" -c 'CREATE DATABASE kicad_prism_survivor_test'

      - name: Compile Python sources
        run: python -m compileall -q app

      - name: Run backend tests
        # pytest-xdist runs this shard's modules on every core; conftest.py gives
        # each worker its own copy of the three databases. -rs lists skip reasons.
        run: python -m pytest -n auto -q -rs --shard ${{ matrix.shard }}/3 --junitxml=results.xml

      - name: Keep this shard's results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: backend-results-${{ matrix.shard }}
          path: backend/results.xml
          retention-days: 7

  backend-results:
    name: Backend
    needs: [changes, backend]
    if: ${{ !cancelled() && needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Collect the shards' results
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: backend-results-*

      - name: Require every shard to pass
        env:
          SHARDS_RESULT: ${{ needs.backend.result }}
        run: test "$SHARDS_RESULT" = "success"

      - name: Require the integration suites to have run
        run: |
          # The catalog and legacy-survivor integration tests skip themselves
          # when their database URL is missing or points at the application
          # database, and the agent API tests without httpx, so a silent skip
          # looks green. Read the skips from the shards' results instead of
          # running the suites a second time.
          python - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          required = {
              "test_component_catalog_postgres_integration": "TEST_POSTGRES_URL",
              "test_legacy_catalog_survivor_postgres_integration": "LEGACY_SURVIVOR_TEST_POSTGRES_URL",
              "test_agent_api": "httpx (requirements/test.txt) and PRISM_DATABASE_URL",
          }
          ran = dict.fromkeys(required, 0)
          failed = False
          cases = [case for path in sorted(glob.glob("backend-results-*/results.xml"))
                   for case in ET.parse(path).iter("testcase")]
          if not cases:
              sys.exit("no backend results found")
          for case in cases:
              module = case.get("classname", "").split(".")[-2] if "." in case.get("classname", "") else ""
              if module not in required:
                  continue
              if case.find("skipped") is not None:
                  print(f"{module}.{case.get('name')} skipped; check {required[module]}.", file=sys.stderr)
                  failed = True
              else:
                  ran[module] += 1
          for module, count in ran.items():
              if not count:
                  print(f"{module}: no test ran; check {required[module]}.", file=sys.stderr)
                  failed = True
          sys.exit(1 if failed else 0)
          PY

  agent-plugin:
    name: Agent and plugin
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version

      - name: Install test dependencies
        # The plugin is stdlib-only; the agent's own requirements (pystray, Pillow,
        # truststore) are needed by the tray tests. Those run pystray's dummy backend,
        # so no display is needed. wx and pcbnew are never imported by the tests.
        run: python -m pip install pytest -r tools/prism_agent/requirements.txt

      - name: Compile agent and plugin sources
        run: python -m compileall -q tools/prism_agent tools/kicad_plugin

      - name: Run agent and plugin tests
        # --slow includes any slow engine suites, which are skipped by default locally
        # (see tools/conftest.py). The gate runs everything.
        run: python -m pytest tools/tests -q --slow

  semantic-viewer:
    name: Semantic viewer
    needs: changes
    if: needs.changes.outputs.viewer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: kicad-prism-viewer

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: kicad-prism-viewer/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements/runtime.lock

      - name: Install dependencies
        run: |
          npm ci
          # The shared Python lock is the same graph used by the backend and
          # production image, including the coordinated Monkey/Cruncher pair.
          python -m pip install -r requirements-runtime.txt

      - name: Test glTF conversion
        run: npm run test:gltf

      - name: Test viewer
        run: npm run test:viewer

      - name: Test pixel-diff harness helpers
        run: npm run test:harness

      - name: Test topology compiler
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Build viewer bundles
        run: npm run build

      - name: Require the served semantic viewer to match source
        working-directory: ${{ github.workspace }}
        run: >-
          git diff --exit-code --
          frontend/public/prism-semantic-viewer.js
          frontend/index.html

  native-crate:
    name: Native geometry crate
    # The checks backend/Dockerfile runs on prism-kicad-native, on the PR instead of only in an
    # image build. Same toolchain (rust-toolchain.toml), same Geometer SDK pins (read from the Dockerfile).
    needs: changes
    if: needs.changes.outputs.viewer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: kicad-prism-viewer/native/prism-kicad-native

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Cache the Rust toolchain, crates and build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry
            ~/.cargo/git
            kicad-prism-viewer/native/prism-kicad-native/target
          key: native-${{ runner.os }}-${{ hashFiles('kicad-prism-viewer/native/prism-kicad-native/rust-toolchain.toml', 'kicad-prism-viewer/native/prism-kicad-native/Cargo.lock') }}
          restore-keys: native-${{ runner.os }}-

      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          cargo --version

      - name: Install the SDK's system link libraries
        # The SDK manifest links pthread, rt, stdc++, dl and X11 (OCCT). The image's builder stage
        # (rust:bookworm, a buildpack-deps image) ships libx11-dev; the runner does not.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libx11-dev

      - name: Fetch the Geometer SDK the image links
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          arg() { sed -n "s/^ARG $1=//p" backend/Dockerfile | head -n 1; }
          tag="$(arg GEOMETER_SDK_TAG)"; version="$(arg GEOMETER_SDK_VERSION)"; sha="$(arg GEOMETER_SDK_LINUX_AMD64_SHA256)"
          test -n "$tag" && test -n "$version" && test -n "$sha"
          archive="geometer-sdk-${version}-linux-x64.zip"
          curl --fail --location --retry 3 \
            "https://github.com/wavenumber-eng/geometer/releases/download/${tag}/${archive}" \
            --output "$RUNNER_TEMP/${archive}"
          echo "${sha}  $RUNNER_TEMP/${archive}" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/${archive}" -d "$RUNNER_TEMP/geometer-sdk"
          echo "GEOMETER_SDK_DIR=$RUNNER_TEMP/geometer-sdk" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --check

      - name: Test
        run: cargo test --release --locked

      - name: Clippy
        run: cargo clippy --release --locked -- -D warnings

  native-workspace:
    name: Native workspace
    # Prism's KiCad parser and design-bundle workspace (native/, ADR §4.1, §9.1): the definition of
    # done for its Rust, on its pinned toolchain (native/rust-toolchain.toml). Runs only when
    # native/ changes (ADR §11 G10).
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: native

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Cache the Rust toolchain, crates, cargo-deny and build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-deny
            native/target
          key: native-workspace-${{ runner.os }}-${{ hashFiles('native/rust-toolchain.toml', 'native/Cargo.lock') }}
          restore-keys: native-workspace-${{ runner.os }}-

      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          cargo --version

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

      - name: Generated contract types are current
        run: cargo run --locked -q -p prism-kicad-codegen -- --check

      - name: Dependency licences and sources
        run: |
          set -euo pipefail
          command -v cargo-deny >/dev/null || cargo install cargo-deny --version 0.18.3 --locked
          cargo deny check licenses sources

  # The fork's native, wasm32 and hygiene jobs (native/.github/workflows/, ported by WP-F3). Each
  # calls one entry script in native/scripts/, which runs the same way locally.
  native-platforms:
    name: Native workspace (${{ matrix.platform }})
    # The fork's per-platform materializer job: the producer, pack and bundle tests on the other
    # platforms the worker and developers run (linux amd64 is native-workspace). Parse-stage
    # members must be byte-identical across them (decisions.md, Conventions 3).
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-15
            platform: macos-arm64

    defaults:
      run:
        working-directory: native

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Cache the Rust toolchain, crates and build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: native-platform-${{ matrix.platform }}-${{ hashFiles('native/rust-toolchain.toml', 'native/Cargo.lock') }}
          restore-keys: native-platform-${{ matrix.platform }}-

      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          if ! command -v rustup >/dev/null; then
            # Not every runner image (the arm64 partner images) ships rustup.
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          # rust-toolchain.toml lists rustfmt and clippy; install them with the toolchain.
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          cargo --version

      - name: Producer, pack, bundle and CLI tests
        run: scripts/ci_native_platform.sh

  native-wasm32:
    name: Native wasm32
    # The fork's wasm32 job (the viewer adapter and the in-browser producer build for
    # wasm32-unknown-unknown) plus the wasm-bindgen tests its exit gate ran, under Node.
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: native

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version

      - name: Cache the Rust toolchain, crates, wasm-bindgen and build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            native/target
          key: native-wasm32-${{ runner.os }}-${{ hashFiles('native/rust-toolchain.toml', 'native/Cargo.lock') }}
          restore-keys: native-wasm32-${{ runner.os }}-

      - name: Install the pinned toolchain, wasm32 target and wasm-bindgen
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          bindgen="$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = "\(.*\)"$/\1/p;}' Cargo.lock)"
          if [[ "$(wasm-bindgen-test-runner --version 2>/dev/null | awk '{print $2}')" != "$bindgen" ]]; then
            cargo install wasm-bindgen-cli --version "$bindgen" --locked --force
          fi

      - name: wasm32 builds, clippy and wasm-bindgen tests
        run: scripts/ci_native_wasm32.sh

  native-hygiene:
    name: Native hygiene
    # The Rust structural-hygiene ratchet (rust-hygiene.toml against rust-hygiene-baseline.json,
    # Prism's port of the fork's wn-dev-std check), the parity corpus round trip, and the Prism
    # contracts (npm ci; npm run check:prism-contracts).
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: native

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version

      - name: Cache the Rust toolchain, crates and build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: native-hygiene-${{ runner.os }}-${{ hashFiles('native/rust-toolchain.toml', 'native/Cargo.lock') }}
          restore-keys: native-hygiene-${{ runner.os }}-

      - name: Install the pinned toolchain and uv
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          version="$(sed -n 's/^ARG UV_VERSION=//p' ../backend/Dockerfile | head -n 1)"
          test -n "$version"
          python -m pip install --disable-pip-version-check "uv==${version}"

      - name: Hygiene ratchet, parity corpus and contracts
        env:
          PRISM_HYGIENE_PYTHON: python
        run: scripts/ci_native_hygiene.sh

  design-compare-parser:
    name: Design compare parser
    # The Node object index and delta the design comparison worker runs (backend/design-compare-parser).
    needs: changes
    if: needs.changes.outputs.design_compare == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js
        # No dependencies to install or cache: the package runs on Node alone, as in the image.
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version

      - name: Require the vendored parser to match its provenance
        working-directory: backend/design-compare-parser/vendor
        run: |
          expected="$(python3 -c 'import json; print(json.load(open("kicad-sexpr-parser.provenance.json"))["artifactSha256"])')"
          echo "${expected}  kicad-sexpr-parser.mjs" | sha256sum --check -

      - name: Test object index and delta
        working-directory: backend/design-compare-parser
        run: npm test

      - name: Test the object-delta shadow comparison
        run: python3 -m unittest scripts.test_compare_object_delta

  deployment-config:
    name: Deployment configuration
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Validate default Compose configuration
        run: docker compose --env-file .env.example -f docker-compose.yml config --quiet

      - name: Validate reverse-proxy Compose configuration
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.proxy.yml config --quiet

      - name: Prepare load-test configuration
        run: touch loadtest/.env.loadtest

      - name: Validate load-test Compose configuration
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.loadtest.yml config --quiet

      - name: Validate local kicad-monkey Compose configuration
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.local-kicad-monkey.yml config --quiet

      - name: Validate pull-only release Compose configuration
        env:
          POSTGRES_PASSWORD: ci-release-validation
          PRISM_ENV_FILE: .env.example
        working-directory: deploy/release
        run: |
          docker compose --env-file .env.example -f compose.yml config --quiet
          docker compose --env-file .env.example -f compose.yml --profile proxy config --quiet
          if grep -Eq '^[[:space:]]*build:' compose.yml; then
            echo "Release Compose must not contain build directives." >&2
            exit 1
          fi

      - name: Test that Compose forwards every setting
        run: python3 -m unittest scripts.test_compose_env_forwarding -v

      - name: Test release metadata and bundle generation
        run: python3 -m unittest scripts.test_release_bundle

      - name: Test the deployment installer
        working-directory: scripts
        run: python3 -m unittest test_prism_deploy

      - name: Test the backup tool
        working-directory: scripts
        run: python3 -m unittest test_prism_backup

      - name: Validate generated Compose configuration for every scheme
        run: |
          set -euo pipefail
          for scheme in tailscale tailscale-host dns-01 http-01 internal-ca external-proxy plain-http; do
            python3 - "$scheme" > /tmp/answers.json <<'PY'
          import json, sys
          scheme = sys.argv[1]
          answers = {
              "scheme": scheme,
              "hostname": "prism.example.com",
              "oidc_issuer": "https://sso.example.com",
              "oidc_client_id": "kicad-prism",
              "oidc_client_secret": "ci-placeholder",
              "bootstrap_admins": "admin@example.com",
          }
          if scheme == "dns-01":
              answers.update(
                  dns_provider="cloudflare",
                  dns_credential="abcdefghij0123456789ABCDEFGHIJ0123456789",
              )
          if scheme == "internal-ca":
              answers["certificate_dir"] = "./deploy/certs"
          if scheme.startswith("tailscale"):
              answers["scheme"] = "tailscale"
              answers["hostname"] = "prism.tail1a2b3c.ts.net"
              if scheme == "tailscale-host":
                  answers["ts_mode"] = "host"
              else:
                  answers["ts_authkey"] = "tskey-auth-ci-placeholder"
          print(json.dumps(answers))
          PY
            mkdir -p deploy/certs && touch deploy/certs/prism.crt deploy/certs/prism.key
            python3 -m scripts.prism_deploy --answers /tmp/answers.json --skip-preflight
            # Renders the overlay, then asks Compose whether it merges cleanly.
            eval "$(python3 -c "
          import json, sys
          sys.path.insert(0, 'scripts')
          from prism_deploy import render
          answers = render.normalise(json.load(open('/tmp/answers.json')))
          print(' '.join(render.compose_command(answers, 'config', '--quiet')))
          ")"
            echo "  $scheme: compose configuration is valid"
          done

  dependency-identity:
    name: Dependency identity
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version

      - name: Install uv
        # Read the image's own pin rather than adding a second uv version that
        # has to be kept in step by hand.
        run: |
          version="$(sed -n 's/^ARG UV_VERSION=//p' backend/Dockerfile | head -n 1)"
          test -n "$version"
          python -m pip install --disable-pip-version-check "uv==${version}"

      - name: Reproduce the locked Python runtime
        # `pip install` only adds; the drift this gate exists to catch is a
        # runtime carrying something the lock does not name, so sync into a
        # fresh environment exactly the way the image does.
        run: |
          uv venv .identity-venv --python "$(cat .python-version)"
          uv pip sync --python .identity-venv/bin/python requirements/runtime.lock

      - name: Verify runtime identity
        # Both halves run here. The image can only check Python -- it has no
        # JavaScript manifests on disk -- so this is the only place a drifted
        # Node, npm, or package set fails a gate instead of surfacing later as
        # an unreproducible bug report.
        run: .identity-venv/bin/python scripts/verify_dependency_identity.py

  image:
    name: Backend image
    # PRs into dev/main build the image in the live KiCad job. Elsewhere, build it (no tests) when its
    # inputs change, so a Dockerfile, viewer or shared-placement break fails on the PR that causes it.
    needs: changes
    if: >-
      github.event_name == 'pull_request' && github.base_ref != 'main' && github.base_ref != 'dev'
      && needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          build-args: KICAD_BASE_PLATFORM=linux/amd64
          push: false

  kicad-live:
    name: Release Studio live KiCad
    # Rebuilds the Prism backend image (FROM pinned kicad/kicad). That proves
    # kicad-cli and the baked executor identity. It is not compiling KiCad, and
    # it is not a per-commit concern — run it where a merge or nightly matters.
    needs: changes
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'dev')
          && needs.changes.outputs.image_live == 'true')
      || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build backend image from Dockerfile KiCad default
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          build-args: KICAD_BASE_PLATFORM=linux/amd64
          load: true
          push: false
          tags: release-studio-live-kicad:ci
          # No type=gha layer cache: the image's layers overflow the repository's 10 GB
          # Actions cache, so it evicted itself (and the uv/npm caches) between runs while
          # its export added ~3.5 min to every build.

      - name: Smoke-test native semantic compiler
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/prism-native-smoke"
          mkdir -p "$smoke_root"
          docker run --rm \
            --platform linux/amd64 \
            --volume "${GITHUB_WORKSPACE}/fixtures/release-studio/usb-pd:/fixture:ro" \
            --volume "$smoke_root:/output" \
            --entrypoint /usr/local/bin/prism-kicad-native \
            release-studio-live-kicad:ci \
            compile-semantic \
            --pcb /fixture/USB-PD-Trigger-Board.kicad_pcb \
            --output /output/semantic \
            --tile-size auto \
            --mesh-tolerance-mm 0.005 \
            --meshopt-level medium
          python3 -c 'import json, pathlib, sys; p=json.loads(pathlib.Path(sys.argv[1]).read_text()); assert p["schema"] == "prism.semantic_mesh_pack.v1"; assert p["tiles"]' \
            "$smoke_root/semantic/mesh-pack.json"

      - name: Run Release Studio live KiCad tests
        run: |
          set -euo pipefail
          BAKED_IMAGE="$(docker run --rm --entrypoint /bin/cat release-studio-live-kicad:ci /etc/prism/kicad-base-image | tr -d '\r\n')"
          if [[ ! "$BAKED_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "baked KiCad base image must end with @sha256:<64 lowercase hex>; got: ${BAKED_IMAGE}" >&2
            exit 1
          fi
          export PRISM_RELEASE_EXECUTOR_IMAGE="$BAKED_IMAGE"
          echo "PRISM_RELEASE_EXECUTOR_IMAGE=${PRISM_RELEASE_EXECUTOR_IMAGE}"

          docker run --rm \
            --platform linux/amd64 \
            --env "PRISM_RELEASE_EXECUTOR_IMAGE=${PRISM_RELEASE_EXECUTOR_IMAGE}" \
            --volume "${GITHUB_WORKSPACE}/fixtures/release-studio:/fixtures/release-studio:ro" \
            --entrypoint /app/venv/bin/python \
            release-studio-live-kicad:ci \
            -m tests.release_studio_live_runner

  quality-gate:
    name: Quality gate
    if: ${{ always() }}
    needs:
      - changes
      - catalog-architecture
      - frontend
      - frontend-tests
      - backend
      - backend-results
      - agent-plugin
      - semantic-viewer
      - native-crate
      - native-workspace
      - native-platforms
      - native-wasm32
      - native-hygiene
      - design-compare-parser
      - deployment-config
      - dependency-identity
      - image
      - kicad-live
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every quality job
        # A job the change does not need is skipped (scripts/ci_changes.py); skipped passes. The
        # changes job itself must succeed, or every job would be skipped and the gate pass on nothing.
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          results = {job: info["result"] for job, info in json.loads(os.environ["RESULTS"]).items()}
          for job, result in sorted(results.items()):
              print(f"{job}: {result}")
          bad = [job for job, result in results.items()
                 if result != "success" and not (result == "skipped" and job not in ("changes", "catalog-architecture"))]
          if bad:
              sys.exit(f"failed or missing: {', '.join(sorted(bad))}")
          PY
